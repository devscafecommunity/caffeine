[package]
name = "doppio-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "doppio"
path = "src/main.rs"

[[bin]]
name = "doppio-headless"
path = "src/bin/doppio-headless.rs"
required-features = ["headless"]

[dependencies]
iced.workspace = true
doppio-engine = { path = "../engine" }
image = "0.25"
iced-mcp = { workspace = true, optional = true }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
zip = { version = "9.0", default-features = false, features = ["deflate"] }
iced-code-editor = { version = "0.5.3", features = ["lsp-process"] }
iced_test = { workspace = true, optional = true }
fontdue = { version = "0.9", optional = true }

[features]
agent = ["dep:iced-mcp"]
# Headless UI driver (`doppio-headless`): scripted, human-like actions and
# screenshots without opening a window. See doppio/docs/headless-testing.md.
headless = ["dep:iced_test", "dep:fontdue"]

[dev-dependencies]
iced_test.workspace = true
fontdue = "0.9"
serde_json.workspace = true
