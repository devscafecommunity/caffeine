[package]
name = "doppio-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "doppio"
path = "src/main.rs"

[dependencies]
iced.workspace = true
doppio-engine = { path = "../engine" }
image = "0.25"
iced-mcp = { workspace = true, optional = true }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
zip = { version = "2.6", default-features = false, features = ["deflate"] }
iced-code-editor = "0.5.3"

[features]
agent = ["dep:iced-mcp"]

[dev-dependencies]
iced_test.workspace = true
fontdue = "0.9"
serde_json.workspace = true
